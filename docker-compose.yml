# Immunolyser — Docker Compose
#
# Works for both modes:
#   Server:     set DATA_VOLUME=/pvol, HLA_PEPCLUST_REF_DATA=/opt/immunolyser-ref-data,
#               and IS_DOCKER=true in .env
#   Local user: defaults (./data, ./hla-pepclust-ref-data) are used automatically
#
# HLA_PEPCLUST_REF_DATA holds the MHC-TP reference databases (ref_data/, including
# numba_cache/) on the HOST, bind-mounted into the container. This is required —
# without it, ref_data lives only inside the container's writable layer and is lost
# on every `docker compose up --build` / container recreation, along with the warmed
# Numba cache (silent empty-output failure — see app/tools/README.md).
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up -d             # subsequent runs
#   docker compose down              # stop
#
# flask_app and celery_worker share the same `image:` tag deliberately —
# both build from the identical Dockerfile/context, so without a shared
# tag Compose builds two full ~5.7GB images instead of one, which caused
# real ENOSPC failures during testing. With a shared tag, Compose builds
# once and both services reference it.

services:
  flask_app:
    build: .
    image: immunolyser:latest
    container_name: flask_app
    restart: unless-stopped
    command: ["flask"]
    ports:
      - "5000:5000"
    volumes:
      - ${DATA_VOLUME:-./data}:/pvol
      - ${HLA_PEPCLUST_REF_DATA:-./hla-pepclust-ref-data}:/app/app/tools/HLA-PepClust/data/ref_data
    env_file: .env
    environment:
      - IS_DOCKER=true
      - IMMUNOLYSER_DATA=/pvol
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    networks:
      - internal
      - web

  celery_worker:
    build: .
    image: immunolyser:latest
    container_name: celery_worker
    restart: unless-stopped
    command: ["celery"]
    volumes:
      - ${DATA_VOLUME:-./data}:/pvol
      - ${HLA_PEPCLUST_REF_DATA:-./hla-pepclust-ref-data}:/app/app/tools/HLA-PepClust/data/ref_data
    env_file: .env
    environment:
      - IS_DOCKER=true
      - IMMUNOLYSER_DATA=/pvol
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    # Port not exposed to host — flask_app and celery_worker reach it via the
    # internal network using the service name "redis" (see config.py IS_DOCKER branch)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
